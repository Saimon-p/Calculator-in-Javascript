<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Calculator</title>
    <link rel="stylesheet" href="index.css">
    <link rel="shortcut icon" href="https://res.cloudinary.com/dzmznkaca/image/upload/v1785013871/saimonlogo_bfcofw.png" type="image/x-icon">
</head>
<body>

    <h1>Calculator</h1>
    <h4>A simple and user-friendly online calculator built with JavaScript, HTML, and CSS. Perform basic mathematical operations quickly and easily, directly from your browser on any device.</h4>
    <div class="main-container">
        <div class="main-display"></div>
        <div class="bottom-display"></div> 
        <div class="button-container">
            <div class="buttons-row first">
                <button value="c">C</button>
                <button value="back"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-backspace" viewBox="0 0 16 16">
                        <path d="M5.83 5.146a.5.5 0 0 0 0 .708L7.975 8l-2.147 2.146a.5.5 0 0 0 .707.708l2.147-2.147 2.146 2.147a.5.5 0 0 0 .707-.708L9.39 8l2.146-2.146a.5.5 0 0 0-.707-.708L8.683 7.293 6.536 5.146a.5.5 0 0 0-.707 0z"/>
                        <path d="M13.683 1a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-7.08a2 2 0 0 1-1.519-.698L.241 8.65a1 1 0 0 1 0-1.302L5.084 1.7A2 2 0 0 1 6.603 1zm-7.08 1a1 1 0 0 0-.76.35L1 8l4.844 5.65a1 1 0 0 0 .759.35h7.08a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z"/>
                        </svg>
                </button>
                <button value="÷">÷</button>
            </div>
            <div class="buttons-row">
                <button value=7 >7</button>
                <button value=8 >8</button>
                <button value=9 >9</button>
                <button value="∗">∗</button>
            </div>
            <div class="buttons-row">
                <button value=4>4</button>
                <button value=5>5</button>
                <button value=6>6</button>
                <button value="-">-</button>
            </div>
            <div class="buttons-row">
                <button value=1>1</button>
                <button value=2>2</button>
                <button value=3>3</button>
                <button value="+">+</button>
            </div>
            <div class="buttons-row last">
                <a target="_blank" href="https://github.com/Saimon-p/Calculator-in-Javascript"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="rgb(161, 105, 1)" class="bi bi-github" viewBox="0 0 16 16">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
                        </svg>
                </a>
                <button value=0>0</button>
                <button value=".">.</button>
                <button value="=">=</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
